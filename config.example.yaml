# Copy to config.yaml and set workspace_root for your machine.
# All pipeline and analysis scripts resolve paths through this file.
#
# Default layout supports post-GAM manuscript reproduction from data/open/ only.
# Optional controlled_* keys remain for early-pipeline / CovBat recompute scripts
# and are unused for open figure replication.

# Workspace = this git repository root
workspace_root: /path/to/dMRI_microstructural_factors
code_dir: ${workspace_root}/code
data_open_dir: ${workspace_root}/data/open

# Open product roots (manuscript reproduction)
gam_dir: ${data_open_dir}/gam
analysis_dir: ${data_open_dir}/analysis
atlas_dir: ${data_open_dir}/atlases
open_metadata_dir: ${data_open_dir}/metadata
inclusion_dir: ${data_open_dir}/inclusion

# Compatibility aliases used by some scripts (point at open products)
project_root: ${workspace_root}
data_dir: ${data_open_dir}
derivatives_dir: ${data_open_dir}
results_dir: ${data_open_dir}

# Optional: local controlled workspace for CovBat/GAM recompute or early pipeline.
# Leave null for open-only reproduction; set only if you have those inputs locally.
data_controlled_dir: null
controlled_derivatives_dir: null
controlled_metadata_dir: null
controlled_inclusion_dir: null
subject_outcome_csv: null

cohorts:
  - penn_epilepsy
  - penn_controls
  - hcpya
  - hcpaging

# Optional runtime overrides (null = use system defaults)
singularity_tmpdir: null
conda_env: null

# Site-specific external paths (set locally; never commit config.yaml with real paths)
penn_bids_dir: null
freesurfer_image: null
itksnap_c3d: null
scilpy_conda_env: null
datalad_conda_env: null
freesurfer_subjects_dir: null
