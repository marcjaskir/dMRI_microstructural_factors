# Copy to config.yaml and set workspace_root / controlled roots for your machine.
# All pipeline and analysis scripts resolve paths through this file.

# Workspace = this git repository root
workspace_root: /path/to/dMRI_microstructural_factors
code_dir: ${workspace_root}/code
data_open_dir: ${workspace_root}/data/open
data_controlled_dir: ${workspace_root}/data/controlled

# Tier 1 product roots (default for manuscript reproduction)
gam_dir: ${data_open_dir}/gam
analysis_dir: ${data_open_dir}/analysis
atlas_dir: ${data_open_dir}/atlases
open_metadata_dir: ${data_open_dir}/metadata
inclusion_dir: ${data_open_dir}/inclusion

# Tier 2 roots (CovBat/GAM recompute and early imaging pipeline)
controlled_derivatives_dir: ${data_controlled_dir}/derivatives
controlled_metadata_dir: ${data_controlled_dir}/metadata
controlled_inclusion_dir: ${data_controlled_dir}/inclusion
subject_outcome_csv: ${data_controlled_dir}/subject_outcomes.csv

# Compatibility aliases (early pipeline still uses these names)
project_root: ${workspace_root}
data_dir: ${data_controlled_dir}
derivatives_dir: ${controlled_derivatives_dir}
results_dir: ${data_open_dir}

cohorts:
  - penn_epilepsy
  - penn_controls
  - hcpya
  - hcpaging

# Optional runtime overrides (null = use system defaults)
singularity_tmpdir: null
conda_env: null

# Site-specific external paths (set locally; never commit config.yaml with real paths)
penn_bids_dir: null
freesurfer_image: null
itksnap_c3d: null
scilpy_conda_env: null
datalad_conda_env: null
freesurfer_subjects_dir: null
